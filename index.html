<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3f8" />
    <meta name="description" content="일정, 가계부, 여행, 육아, 일기를 사람들과 메뉴별로 공유하고 관리하는 기록 앱" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>공유 가계부·공유 일정·공유 여행·공유 육아·일기·맛집</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        if (!window.location.search || !/[?&](loggedOut|recover|recoverNav)=/.test(window.location.search)) return
        try {
          var url = new URL(window.location.href)
          url.searchParams.delete('loggedOut')
          url.searchParams.delete('recover')
          url.searchParams.delete('recoverNav')
          window.history.replaceState({}, document.title, url.pathname + url.search + url.hash)
        } catch (error) {
          window.history.replaceState({}, document.title, window.location.pathname)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Backgrounding the app while /src/main.tsx's module fetch is still
      // in flight can leave it permanently suspended on Android (the
      // WebView throttles/pauses network for a backgrounded activity, and
      // the in-progress request never resumes cleanly) — the app comes
      // back to a blank white #root with no JS ever mounting into it and
      // no way to recover on its own. If the page is still empty a
      // moment after becoming visible again, force a fresh reload rather
      // than leave the user stuck.
      ;(function () {
        var recoveredFromBlankResume = false
        function recoverIfStuck() {
          if (document.visibilityState !== 'visible' || recoveredFromBlankResume) return
          var root = document.getElementById('root')
          if (root && root.childElementCount === 0) {
            recoveredFromBlankResume = true
            window.location.reload()
          }
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') window.setTimeout(recoverIfStuck, 1500)
        })
      })()
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
