<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f8" />
    <meta name="description" content="Family calendar, budget, travel, parenting, diary, and community platform" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Family Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        if (!window.location.search || !/[?&](loggedOut|recover|recoverNav)=/.test(window.location.search)) return
        try {
          var url = new URL(window.location.href)
          url.searchParams.delete('loggedOut')
          url.searchParams.delete('recover')
          url.searchParams.delete('recoverNav')
          window.history.replaceState({}, document.title, url.pathname + url.search + url.hash)
        } catch (error) {
          window.history.replaceState({}, document.title, window.location.pathname)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
