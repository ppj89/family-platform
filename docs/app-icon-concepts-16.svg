    <path d="M125 48c42 0 75 33 75 75 0 56-75 98-75 98s-75-42-75-98c0-42 33-75 75-75Z" fill="#fff"/>
    <circle cx="125" cy="121" r="31" fill="#1256d8"/>
    <circle cx="125" cy="121" r="12" fill="#7eead8"/>
    <text class="no" x="125" y="300">10</text>
  </g>

