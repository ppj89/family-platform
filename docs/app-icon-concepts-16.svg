  <g transform="translate(750 718)">
    <rect class="icon" width="250" height="250" rx="58" fill="url(#ice)"/>
    <rect x="58" y="58" width="58" height="58" rx="19" fill="#1256d8"/>
    <rect x="134" y="58" width="58" height="58" rx="19" fill="#7eead8"/>
    <rect x="58" y="134" width="58" height="58" rx="19" fill="#17345f"/>
    <rect x="134" y="134" width="58" height="58" rx="19" fill="#1256d8"/>
