    <rect x="78" y="88" width="94" height="18" rx="9" fill="#fff"/>
    <rect x="78" y="121" width="68" height="18" rx="9" fill="#8de7d8"/>
    <rect x="78" y="154" width="92" height="18" rx="9" fill="#fff"/>
