  <!-- 04: shared calendar -->
  <g transform="translate(1090 58)">
    <rect class="icon" width="250" height="250" rx="58" fill="#17345f"/>
    <rect x="57" y="70" width="136" height="122" rx="32" fill="#fff"/>
    <rect x="57" y="70" width="136" height="40" rx="28" fill="#7eead8"/>
    <circle cx="93" cy="148" r="19" fill="#2f80ed"/>
    <circle cx="143" cy="148" r="19" fill="#2f80ed"/>
    <path class="s" d="M89 55v28M161 55v28" stroke="#fff" stroke-width="16"/>
