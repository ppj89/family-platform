    <rect class="icon" width="250" height="250" rx="58" fill="url(#blueB)"/>
    <path d="M78 54h94c13 0 24 11 24 24v121l-71-33-71 33V78c0-13 11-24 24-24Z" fill="#fff"/>
    <rect x="90" y="88" width="70" height="17" rx="9" fill="#1256d8"/>
    <rect x="90" y="122" width="52" height="17" rx="9" fill="#7eead8"/>
