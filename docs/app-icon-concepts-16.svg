  </g>

  <!-- 08: record stack -->
  <g transform="translate(1090 388)">
    <rect class="icon" width="250" height="250" rx="58" fill="#f7fbff"/>
    <rect x="78" y="52" width="108" height="138" rx="28" fill="#dcecff"/>
    <rect x="64" y="70" width="108" height="138" rx="28" fill="#1256d8"/>
    <rect x="88" y="100" width="60" height="14" rx="7" fill="#fff"/>
    <rect x="88" y="132" width="42" height="14" rx="7" fill="#7eead8"/>
    <rect x="88" y="164" width="58" height="14" rx="7" fill="#fff"/>
