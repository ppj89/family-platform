<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#13233d" flood-opacity=".16"/>
    </filter>
    <linearGradient id="blueA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#1256d8"/>
    </linearGradient>
    <linearGradient id="blueB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16233d"/>
      <stop offset="1" stop-color="#1f6fff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#80ead8"/>
      <stop offset="1" stop-color="#2e82ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <style>
      .bg { fill:#eef3f8; }
      .icon { filter:url(#shadow); }
      .no { font: 700 18px Arial, sans-serif; fill:#8a97a8; text-anchor:middle; }
      .s { stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1440"/>

  <!-- 01: protected family home -->
  <g transform="translate(70 58)">
    <rect class="icon" width="250" height="250" rx="58" fill="url(#blueA)"/>
    <path d="M125 45 198 84v64c0 47-31 80-73 101-42-21-73-54-73-101V84l73-39Z" fill="#fff"/>
    <path d="M83 127 125 90l42 37v45h-29v-33h-26v33H83v-45Z" fill="#1760d9"/>
    <text class="no" x="125" y="300">01</text>
  </g>

  <!-- 02: family node mark -->
  <g transform="translate(410 58)">
    <rect class="icon" width="250" height="250" rx="58" fill="url(#blueB)"/>
    <circle cx="125" cy="82" r="34" fill="#fff"/>
    <circle cx="78" cy="158" r="30" fill="#7eead8"/>
    <circle cx="172" cy="158" r="30" fill="#fff"/>
    <path class="s" d="M125 116v35M100 151h50" stroke="#fff" stroke-width="18"/>
