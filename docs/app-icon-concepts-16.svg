    <path class="s" d="M78 134c0-31 20-52 47-52 24 0 36 18 49 39 10 17 19 31 36 31 15 0 26-12 26-29 0-18-11-31-27-31-14 0-23 7-33 20" transform="translate(-32 0)" fill="none" stroke="#fff" stroke-width="22"/>
    <circle cx="92" cy="125" r="18" fill="#7eead8"/>
    <circle cx="158" cy="125" r="18" fill="#2f80ed"/>
    <text class="no" x="125" y="300">09</text>
