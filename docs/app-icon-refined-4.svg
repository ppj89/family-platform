<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none">
  <defs>
    <linearGradient id="bgA" x1="46" y1="42" x2="234" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61A5FF"/>
      <stop offset=".5" stop-color="#2878F0"/>
      <stop offset="1" stop-color="#1354C8"/>
    </linearGradient>
    <linearGradient id="bgB" x1="366" y1="42" x2="554" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F355B"/>
      <stop offset="1" stop-color="#1266E3"/>
    </linearGradient>
    <linearGradient id="bgC" x1="686" y1="42" x2="874" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#DDEBFF"/>
    </linearGradient>
    <linearGradient id="bgD" x1="1006" y1="42" x2="1194" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71E4D5"/>
      <stop offset=".55" stop-color="#348AF4"/>
      <stop offset="1" stop-color="#1254C8"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1D3150" flood-opacity=".18"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0A3678" flood-opacity=".18"/>
    </filter>
    <style>
      .page { fill: #EEF3F8; }
      .tile { filter: url(#tileShadow); }
      .label { fill: #5D6B7B; font: 700 18px Arial, sans-serif; text-anchor: middle; letter-spacing: .02em; }
      .sub { fill: #8B98A8; font: 600 13px Arial, sans-serif; text-anchor: middle; }
      .line { stroke-linecap: round; stroke-linejoin: round; }
      .white { fill: #fff; }
      .blue { fill: #1F73E8; }
      .navy { fill: #15243D; }
    </style>
  </defs>

  <rect class="page" width="1280" height="360"/>

  <!-- A: 가장 안정적인 집 + 가족 연결 심볼 -->
  <g transform="translate(40 34)">
    <rect class="tile" width="240" height="240" rx="56" fill="url(#bgA)"/>
    <path filter="url(#markShadow)" d="M64 118c0-7 3-13 9-18l47-40c8-7 18-7 26 0l47 40c6 5 9 11 9 18v55c0 16-13 29-29 29H91c-16 0-27-13-27-29v-55Z" fill="#fff"/>
    <path d="M100 152c0-18 15-33 33-33s33 15 33 33v50h-66v-50Z" fill="#E8F2FF"/>
    <circle cx="133" cy="144" r="15" fill="#236FE6"/>
    <circle cx="104" cy="179" r="13" fill="#236FE6"/>
    <circle cx="162" cy="179" r="13" fill="#236FE6"/>
    <path class="line" d="M118 168h30" stroke="#236FE6" stroke-width="10"/>
    <text class="label" x="120" y="286">A</text>
    <text class="sub" x="120" y="310">HOME NODE</text>
  </g>

  <!-- B: 보호되는 기록 공간 -->
  <g transform="translate(360 34)">
    <rect class="tile" width="240" height="240" rx="56" fill="url(#bgB)"/>
    <path filter="url(#markShadow)" d="M120 45 190 82v56c0 48-29 78-70 99-41-21-70-51-70-99V82l70-37Z" fill="#fff"/>
    <rect x="83" y="94" width="74" height="86" rx="22" fill="#E7F1FF"/>
    <rect x="99" y="113" width="42" height="10" rx="5" fill="#1F73E8"/>
    <rect x="99" y="139" width="34" height="10" rx="5" fill="#1F73E8"/>
    <circle cx="157" cy="165" r="17" fill="#1F73E8"/>
    <path class="line" d="m149 165 6 6 12-15" stroke="#fff" stroke-width="5"/>
    <text class="label" x="120" y="286">B</text>
    <text class="sub" x="120" y="310">SAFE RECORD</text>
  </g>

  <!-- C: 밝고 세련된 가족 연결 마크 -->
  <g transform="translate(680 34)">
    <rect class="tile" width="240" height="240" rx="56" fill="url(#bgC)"/>
    <circle cx="120" cy="120" r="78" fill="#1E66DC"/>
    <circle cx="120" cy="85" r="26" fill="#fff"/>
    <circle cx="83" cy="151" r="24" fill="#A8EDE3"/>
    <circle cx="157" cy="151" r="24" fill="#fff"/>
    <path class="line" d="M120 112v30M99 144h42" stroke="#fff" stroke-width="14"/>
    <text class="label" x="120" y="286">C</text>
    <text class="sub" x="120" y="310">FAMILY RING</text>
  </g>

  <!-- D: 앱 런처에서 가장 단순하게 보이는 보관함 심볼 -->
  <g transform="translate(1000 34)">
    <rect class="tile" width="240" height="240" rx="56" fill="url(#bgD)"/>
    <path filter="url(#markShadow)" d="M73 73h94c17 0 31 14 31 31v69c0 17-14 31-31 31H73c-17 0-31-14-31-31v-69c0-17 14-31 31-31Z" fill="#fff"/>
    <path d="M73 73h54c8 0 12 3 17 9l11 14h43v20H42v-12c0-17 14-31 31-31Z" fill="#DCEBFF"/>
    <rect x="75" y="133" width="86" height="14" rx="7" fill="#1F73E8"/>
    <rect x="75" y="161" width="56" height="14" rx="7" fill="#1F73E8"/>
    <text class="label" x="120" y="286">D</text>
    <text class="sub" x="120" y="310">ARCHIVE</text>
  </g>
</svg>
