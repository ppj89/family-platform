services:
  db:
    image: postgres:18.4-alpine
    container_name: ${DB_CONTAINER_NAME:-family-platform-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - family_platform_prod_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend-go
    container_name: ${API_CONTAINER_NAME:-family-platform-api}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET}
      APP_SECURITY_TOKEN_VALIDITY_SECONDS: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:-86400}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      APP_AUTH_EMAIL_VERIFICATION_REQUIRED: ${APP_AUTH_EMAIL_VERIFICATION_REQUIRED:-false}
      APP_WITHDRAWN_ACCOUNT_RETENTION_DAYS: ${APP_WITHDRAWN_ACCOUNT_RETENTION_DAYS:-365}
      APP_ACTIVITY_HISTORY_RETENTION_DAYS: ${APP_ACTIVITY_HISTORY_RETENTION_DAYS:-365}
      APP_ACTIVITY_AGGREGATE_RETENTION_DAYS: ${APP_ACTIVITY_AGGREGATE_RETENTION_DAYS:-365}
      APP_HOLIDAY_SYNC_ENABLED: ${APP_HOLIDAY_SYNC_ENABLED:-true}
      APP_HOLIDAY_SYNC_SERVICE_KEY: ${APP_HOLIDAY_SYNC_SERVICE_KEY:-}
      APP_HOLIDAY_API_BASE_URL: ${APP_HOLIDAY_API_BASE_URL:-http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo}
      APP_HOLIDAY_SYNC_YEAR_WINDOW_BEFORE: ${APP_HOLIDAY_SYNC_YEAR_WINDOW_BEFORE:-1}
      APP_HOLIDAY_SYNC_YEAR_WINDOW_AFTER: ${APP_HOLIDAY_SYNC_YEAR_WINDOW_AFTER:-2}
      APP_MAIL_DAILY_LIMIT_PER_IDENTIFIER: ${APP_MAIL_DAILY_LIMIT_PER_IDENTIFIER:-3}
      APP_BREVO_API_KEY: ${APP_BREVO_API_KEY:-}
      APP_MAIL_FROM_EMAIL: ${APP_MAIL_FROM_EMAIL:-}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-FamilyPlatform}
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-587}
      APP_SMTP_USERNAME: ${APP_SMTP_USERNAME:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_FROM: ${APP_SMTP_FROM:-}
      APP_FIREBASE_SERVICE_ACCOUNT_PATH: ${APP_FIREBASE_SERVICE_ACCOUNT_PATH:-/run/secrets/firebase-service-account.json}
      APP_FIREBASE_PROJECT_ID: ${APP_FIREBASE_PROJECT_ID:-together-records}
      APP_OAUTH_GOOGLE_CLIENT_ID: ${APP_OAUTH_GOOGLE_CLIENT_ID:-}
      APP_OAUTH_GOOGLE_CLIENT_SECRET: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:-}
      APP_GOOGLE_PLACES_API_KEY: ${APP_GOOGLE_PLACES_API_KEY:-}
      APP_GOOGLE_MAPS_API_KEY: ${APP_GOOGLE_MAPS_API_KEY:-}
      APP_NAVER_SEARCH_CLIENT_ID: ${APP_NAVER_SEARCH_CLIENT_ID:-}
      APP_NAVER_SEARCH_CLIENT_SECRET: ${APP_NAVER_SEARCH_CLIENT_SECRET:-}
      APP_OAUTH_NAVER_CLIENT_ID: ${APP_OAUTH_NAVER_CLIENT_ID:-}
      APP_OAUTH_NAVER_CLIENT_SECRET: ${APP_OAUTH_NAVER_CLIENT_SECRET:-}
      APP_OAUTH_KAKAO_CLIENT_ID: ${APP_OAUTH_KAKAO_CLIENT_ID:-}
      APP_OAUTH_KAKAO_CLIENT_SECRET: ${APP_OAUTH_KAKAO_CLIENT_SECRET:-}
      APP_KAKAO_REST_API_KEY: ${APP_KAKAO_REST_API_KEY:-}
      APP_MEDIA_MAX_FILES_PER_POST: ${APP_MEDIA_MAX_FILES_PER_POST:-5}
      APP_MEDIA_MAX_REFERENCE_LENGTH: ${APP_MEDIA_MAX_REFERENCE_LENGTH:-2048}
      # 정책 확정 전까지 크기 제한은 비활성입니다. true로 바꾸면 아래 이미지/영상 값이 적용됩니다.
      APP_MEDIA_SIZE_LIMITS_ENABLED: ${APP_MEDIA_SIZE_LIMITS_ENABLED:-true}
      APP_MEDIA_MAX_IMAGE_SIZE: ${APP_MEDIA_MAX_IMAGE_SIZE:-5MB}
      APP_MEDIA_MAX_VIDEO_SIZE: ${APP_MEDIA_MAX_VIDEO_SIZE:-20MB}
      APP_MEDIA_USER_QUOTA: ${APP_MEDIA_USER_QUOTA:-1GB}
      APP_MEDIA_STORAGE_DRIVER: ${APP_MEDIA_STORAGE_DRIVER:-local}
      APP_MEDIA_STORAGE_PATH: /app/uploads
      APP_DB_BACKUP_CONTROL_PATH: /app/db-backup-control
      APP_MEDIA_PUBLIC_URL_PREFIX: ${APP_MEDIA_PUBLIC_URL_PREFIX:-/api/media/files}
      APP_MEDIA_S3_ENDPOINT: ${APP_MEDIA_S3_ENDPOINT:-}
      APP_MEDIA_S3_REGION: ${APP_MEDIA_S3_REGION:-auto}
      APP_MEDIA_S3_BUCKET: ${APP_MEDIA_S3_BUCKET:-}
      APP_MEDIA_S3_ACCESS_KEY_ID: ${APP_MEDIA_S3_ACCESS_KEY_ID:-}
      APP_MEDIA_S3_SECRET_ACCESS_KEY: ${APP_MEDIA_S3_SECRET_ACCESS_KEY:-}
    expose:
      - "8080"
    volumes:
      - family_platform_prod_uploads:/app/uploads
      - family_platform_prod_db_backup_control:/app/db-backup-control
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  db-backup:
    build:
      context: ./ops/db-backup
    container_name: ${DB_BACKUP_CONTAINER_NAME:-family-platform-db-backup}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_MEDIA_S3_ENDPOINT: ${APP_MEDIA_S3_ENDPOINT:-}
      APP_MEDIA_S3_REGION: ${APP_MEDIA_S3_REGION:-auto}
      APP_MEDIA_S3_BUCKET: ${APP_MEDIA_S3_BUCKET:-}
      APP_MEDIA_S3_ACCESS_KEY_ID: ${APP_MEDIA_S3_ACCESS_KEY_ID:-}
      APP_MEDIA_S3_SECRET_ACCESS_KEY: ${APP_MEDIA_S3_SECRET_ACCESS_KEY:-}
      APP_DB_BACKUP_PREFIX: ${APP_DB_BACKUP_PREFIX:-database-backups/}
      APP_DB_BACKUP_KEEP_DAYS: ${APP_DB_BACKUP_KEEP_DAYS:-7}
      APP_DB_BACKUP_INTERVAL_SECONDS: ${APP_DB_BACKUP_INTERVAL_SECONDS:-86400}
      APP_DB_BACKUP_CONTROL_PATH: /var/run/family-platform-db-backup
    volumes:
      - family_platform_prod_db_backup_control:/var/run/family-platform-db-backup

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ${WEB_CONTAINER_NAME:-family-platform-web}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - family_platform_prod_downloads:/usr/share/nginx/downloads:ro

volumes:
  family_platform_prod_db:
    name: ${DB_VOLUME_NAME:-family_platform_prod_db}
  family_platform_prod_uploads:
    name: ${UPLOADS_VOLUME_NAME:-family_platform_prod_uploads}
  family_platform_prod_db_backup_control:
    name: ${DB_BACKUP_CONTROL_VOLUME_NAME:-family_platform_prod_db_backup_control}
  family_platform_prod_downloads:
    name: ${DOWNLOADS_VOLUME_NAME:-family_platform_prod_downloads}
