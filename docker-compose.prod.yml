services:
  db:
    image: postgres:18.4-alpine
    container_name: ${DB_CONTAINER_NAME:-family-platform-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - family_platform_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend-go
    container_name: ${API_CONTAINER_NAME:-family-platform-api}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET}
      APP_SECURITY_TOKEN_VALIDITY_SECONDS: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:-86400}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      APP_AUTH_EMAIL_VERIFICATION_REQUIRED: ${APP_AUTH_EMAIL_VERIFICATION_REQUIRED:-false}
      APP_MAIL_DAILY_LIMIT_PER_IDENTIFIER: ${APP_MAIL_DAILY_LIMIT_PER_IDENTIFIER:-3}
      APP_BREVO_API_KEY: ${APP_BREVO_API_KEY:-}
      APP_MAIL_FROM_EMAIL: ${APP_MAIL_FROM_EMAIL:-}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-FamilyPlatform}
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-587}
      APP_SMTP_USERNAME: ${APP_SMTP_USERNAME:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_FROM: ${APP_SMTP_FROM:-}
      APP_OAUTH_GOOGLE_CLIENT_ID: ${APP_OAUTH_GOOGLE_CLIENT_ID:-}
      APP_OAUTH_GOOGLE_CLIENT_SECRET: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:-}
      APP_OAUTH_NAVER_CLIENT_ID: ${APP_OAUTH_NAVER_CLIENT_ID:-}
      APP_OAUTH_NAVER_CLIENT_SECRET: ${APP_OAUTH_NAVER_CLIENT_SECRET:-}
      APP_OAUTH_KAKAO_CLIENT_ID: ${APP_OAUTH_KAKAO_CLIENT_ID:-}
      APP_OAUTH_KAKAO_CLIENT_SECRET: ${APP_OAUTH_KAKAO_CLIENT_SECRET:-}
      APP_KAKAO_REST_API_KEY: ${APP_KAKAO_REST_API_KEY:-}
      APP_MEDIA_MAX_FILES_PER_POST: ${APP_MEDIA_MAX_FILES_PER_POST:-6}
      APP_MEDIA_MAX_REFERENCE_LENGTH: ${APP_MEDIA_MAX_REFERENCE_LENGTH:-2048}
      APP_MEDIA_MAX_IMAGE_SIZE: ${APP_MEDIA_MAX_IMAGE_SIZE:-8MB}
      APP_MEDIA_MAX_VIDEO_SIZE: ${APP_MEDIA_MAX_VIDEO_SIZE:-30MB}
      APP_MEDIA_STORAGE_DRIVER: ${APP_MEDIA_STORAGE_DRIVER:-local}
      APP_MEDIA_STORAGE_PATH: /app/uploads
      APP_MEDIA_PUBLIC_URL_PREFIX: ${APP_MEDIA_PUBLIC_URL_PREFIX:-/api/media/files}
      APP_MEDIA_S3_ENDPOINT: ${APP_MEDIA_S3_ENDPOINT:-}
      APP_MEDIA_S3_REGION: ${APP_MEDIA_S3_REGION:-auto}
      APP_MEDIA_S3_BUCKET: ${APP_MEDIA_S3_BUCKET:-}
      APP_MEDIA_S3_ACCESS_KEY_ID: ${APP_MEDIA_S3_ACCESS_KEY_ID:-}
      APP_MEDIA_S3_SECRET_ACCESS_KEY: ${APP_MEDIA_S3_SECRET_ACCESS_KEY:-}
    expose:
      - "8080"
    volumes:
      - family_platform_prod_uploads:/app/uploads

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ${WEB_CONTAINER_NAME:-family-platform-web}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - family_platform_prod_downloads:/usr/share/nginx/downloads:ro

volumes:
  family_platform_prod_db:
    name: ${DB_VOLUME_NAME:-family_platform_prod_db}
  family_platform_prod_uploads:
    name: ${UPLOADS_VOLUME_NAME:-family_platform_prod_uploads}
  family_platform_prod_downloads:
    name: ${DOWNLOADS_VOLUME_NAME:-family_platform_prod_downloads}
