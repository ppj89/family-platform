services:
  db:
    image: postgres:18.4-alpine
    container_name: family-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - family_platform_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: family-platform-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_SECURITY_TOKEN_SECRET: ${APP_SECURITY_TOKEN_SECRET}
      APP_SECURITY_TOKEN_VALIDITY_SECONDS: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:-86400}
      APP_MEDIA_MAX_FILE_SIZE: ${APP_MEDIA_MAX_FILE_SIZE:-30MB}
      APP_MEDIA_MAX_REQUEST_SIZE: ${APP_MEDIA_MAX_REQUEST_SIZE:-40MB}
      APP_MEDIA_MAX_FILES_PER_POST: ${APP_MEDIA_MAX_FILES_PER_POST:-6}
      APP_MEDIA_MAX_REFERENCE_LENGTH: ${APP_MEDIA_MAX_REFERENCE_LENGTH:-2048}
      APP_MEDIA_MAX_IMAGE_SIZE: ${APP_MEDIA_MAX_IMAGE_SIZE:-8MB}
      APP_MEDIA_MAX_VIDEO_SIZE: ${APP_MEDIA_MAX_VIDEO_SIZE:-30MB}
      APP_MEDIA_STORAGE_PATH: /app/uploads
      APP_MEDIA_PUBLIC_URL_PREFIX: ${APP_MEDIA_PUBLIC_URL_PREFIX:-/api/media/files}
    expose:
      - "8080"
    volumes:
      - family_platform_uploads:/app/uploads

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: family-platform-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  family_platform_db:
  family_platform_uploads:
