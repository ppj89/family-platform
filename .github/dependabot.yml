# Weekly dependency updates. Each ecosystem's minor/patch bumps arrive as a
# single grouped PR so CI checks them together; security fixes are raised
# separately and immediately (Dependabot security updates, see
# infra/terraform/github.tf).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint only supports TypeScript < 6.1; bump together by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: gomod
    directory: /backend-go
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /backend-go, /ops/db-backup]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      base-images:
        patterns: ["*"]
