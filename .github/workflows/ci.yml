name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Test
        working-directory: backend-go
        run: go test ./...

  api-integration:
    name: Go API integration
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start API stack
        run: docker compose up --build -d db api

      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Run API integration tests
        run: sh scripts/test-go-api.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  docker:
    name: Docker production config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config --quiet

      - name: Build backend image
        run: docker build -f backend-go/Dockerfile backend-go

      - name: Build web image
        run: docker build -f Dockerfile .

  production-smoke:
    name: Production stack smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production stack smoke test
        run: scripts/test-prod-stack.sh

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npm run cap:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npm run cap:ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
