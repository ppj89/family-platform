name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Test
        working-directory: backend-go
        run: go test ./...

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        # No backend here: validation needs no R2 or GitHub credentials.
        run: |
          terraform init -backend=false -input=false
          terraform validate

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Check Go vulnerabilities
        working-directory: backend-go
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  api-integration:
    name: Go API integration
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start API stack
        run: docker compose up --build -d db api

      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Run API integration tests
        run: sh scripts/test-go-api.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  docker:
    name: Docker production config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production readiness
        run: ALLOW_PLACEHOLDERS=1 scripts/validate-prod-config.sh .env.production.example

      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config --quiet

      - name: Build backend image
        run: |
          for attempt in 1 2 3; do
            if docker build -f backend-go/Dockerfile backend-go; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Build web image
        run: |
          for attempt in 1 2 3; do
            if docker build -f Dockerfile .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          exit 1

  production-smoke:
    name: Production stack smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run production stack smoke test
        run: scripts/test-prod-stack.sh

  deploy-server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: [frontend, backend, security, terraform, api-integration, docker, production-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Deploys queue up in order; a running deploy is never cancelled halfway.
    concurrency:
      group: production-server-deploy
      cancel-in-progress: false
    steps:
      - name: Configure deploy key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy (server backs up, deploys, health-checks, rolls back on failure)
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          # The key is pinned server-side to scripts/ci-deploy.sh; this
          # string is only the request it validates.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "root@$PROD_SSH_HOST" "deploy $GITHUB_SHA"

      - name: Verify from outside
        run: |
          curl -fsS --max-time 10 https://familyhistory.dedyn.io/health >/dev/null
          curl -fsS --max-time 10 https://familyhistory.dedyn.io/api/health

      - name: Alert Slack on deploy failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          text="🚨 [자동 배포 실패] ${GITHUB_SHA::7} 배포가 실패했습니다. 서버는 이전 버전으로 롤백을 시도합니다. 로그: $RUN_URL"
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" >/dev/null

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Android
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default package list includes the long-removed
          # 'tools' package, which makes sdkmanager exit 1 on current runners.
          packages: ''

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npm run cap:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  release-play-store:
    name: Release AAB to Play Store
    runs-on: ubuntu-latest
    needs: [frontend, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Android
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default package list includes the long-removed
          # 'tools' package, which makes sdkmanager exit 1 on current runners.
          packages: ''

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build web assets and sync Capacitor
        run: npm run cap:android
        env:
          CAPACITOR_SERVER_URL: https://familyhistory.dedyn.io
          VITE_API_BASE_URL: https://familyhistory.dedyn.io/api

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease -PreleaseVersionCode=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Write Play service account key
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/play-service-account.json"

      - name: Upload to Play Console (production)
        run: node scripts/publish-play-console.mjs --track production
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npm run cap:ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
