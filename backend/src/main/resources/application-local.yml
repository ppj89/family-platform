spring:
  datasource:
    url: jdbc:h2:file:./.data/family-platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

app:
  seed-default-account: true
  security:
    token-secret: local-dev-secret-only-change-for-shared-env
