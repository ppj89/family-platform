server:
  port: 8080

spring:
  application:
    name: family-platform-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/family_platform}
    username: ${SPRING_DATASOURCE_USERNAME:family_app}
    password: ${SPRING_DATASOURCE_PASSWORD:family_app_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    token-secret: ${APP_SECURITY_TOKEN_SECRET:change-this-dev-secret-before-production}
    token-validity-seconds: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
