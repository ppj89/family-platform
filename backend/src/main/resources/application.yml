server:
  port: 8080

spring:
  application:
    name: family-platform-api
  servlet:
    multipart:
      max-file-size: ${APP_MEDIA_MAX_FILE_SIZE:30MB}
      max-request-size: ${APP_MEDIA_MAX_REQUEST_SIZE:40MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/family_platform}
    username: ${SPRING_DATASOURCE_USERNAME:family_app}
    password: ${SPRING_DATASOURCE_PASSWORD:family_app_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    token-secret: ${APP_SECURITY_TOKEN_SECRET:change-this-dev-secret-before-production}
    token-validity-seconds: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:86400}
  media:
    max-files-per-post: ${APP_MEDIA_MAX_FILES_PER_POST:6}
    max-reference-length: ${APP_MEDIA_MAX_REFERENCE_LENGTH:2048}
    max-image-size: ${APP_MEDIA_MAX_IMAGE_SIZE:8MB}
    max-video-size: ${APP_MEDIA_MAX_VIDEO_SIZE:30MB}
    storage-path: ${APP_MEDIA_STORAGE_PATH:uploads}
    public-url-prefix: ${APP_MEDIA_PUBLIC_URL_PREFIX:/api/media/files}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
